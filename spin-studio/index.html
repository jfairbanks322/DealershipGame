<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdf7" />
    <title>Class Prize Wheel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="wheel-area" aria-labelledby="wheelTitle">
        <header class="wheel-header">
          <input id="wheelTitle" class="wheel-title" maxlength="48" value="Class Prize Wheel" aria-label="Wheel title" />
          <div class="header-actions">
            <button id="editorToggle" class="plain-button" type="button">Hide editor</button>
            <button id="fullscreenButton" class="icon-button" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
            </button>
          </div>
        </header>

        <div class="canvas-wrap">
          <canvas id="wheelCanvas" width="720" height="720" role="img" aria-label="Interactive classroom prize wheel. Click the center to spin."></canvas>
        </div>

        <button id="spinButton" class="spin-button" type="button">
          <span aria-hidden="true">✦</span>
          <strong>SPIN</strong>
          <kbd>SPACE</kbd>
        </button>

        <fieldset class="spin-length" aria-label="Spin length">
          <legend>Spin length</legend>
          <label>
            <input type="radio" name="spinLength" value="regular" checked />
            <span>Regular <small>3–8s</small></span>
          </label>
          <label>
            <input type="radio" name="spinLength" value="medium" />
            <span>Medium <small>8–14s</small></span>
          </label>
          <label>
            <input type="radio" name="spinLength" value="long" />
            <span>Long <small>14–22s</small></span>
          </label>
        </fieldset>

        <p id="lastResult" class="last-result" aria-live="polite">Ready to spin</p>
      </section>

      <aside id="slotEditor" class="slot-editor" aria-label="Edit wheel slots">
        <header class="editor-header">
          <div>
            <h1>Wheel slots</h1>
            <p>Tap any name to change it.</p>
          </div>
          <span id="slotCount" class="slot-count">6 / 24</span>
        </header>

        <form id="addSlotForm" class="add-row">
          <label class="sr-only" for="newSlotInput">New slot name</label>
          <input id="newSlotInput" maxlength="42" placeholder="Type a name or prize…" autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <div class="wildcard-add">
          <label for="wildcardSelect"><span aria-hidden="true">★</span> Add a wildcard</label>
          <div class="wildcard-row">
            <select id="wildcardSelect" aria-label="Wildcard action"></select>
            <button id="addWildcardButton" type="button">Add</button>
          </div>
        </div>

        <div class="list-heading">
          <strong>Current slots</strong>
          <button id="shuffleButton" class="text-button" type="button">Shuffle</button>
        </div>
        <div id="slotList" class="slot-list"></div>

        <footer class="editor-footer">
          <label class="sound-setting" for="soundToggle">
            <input id="soundToggle" type="checkbox" checked />
            Sound
          </label>
          <button id="resetButton" class="text-button danger" type="button">Reset wheel</button>
        </footer>
      </aside>
    </main>

    <section id="resultModal" class="result-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="resultName">
      <div class="result-card">
        <button id="closeResultButton" class="modal-close" type="button" aria-label="Close result">×</button>
        <p id="resultKicker" class="result-kicker">RESULT</p>
        <div id="resultIcon" class="result-icon" aria-hidden="true">★</div>
        <h2 id="resultName">Prize Box</h2>
        <p id="resultInstruction" hidden></p>
        <p id="autoStatus" class="auto-status" hidden>Next spin starts automatically…</p>
        <div id="resultRemovalActions" class="result-removal-actions" hidden>
          <p id="removalHint">Clear this result from future spins?</p>
          <div>
            <button id="removeSliceButton" type="button">Clear landed slice</button>
            <button id="removeMatchingButton" type="button">Clear all matching</button>
          </div>
        </div>
        <button id="resultActionButton" class="result-action" type="button">Done</button>
      </div>
    </section>

    <div id="liveRegion" class="sr-only" role="status" aria-live="assertive"></div>
    <script src="./app.js"></script>
  </body>
</html>
