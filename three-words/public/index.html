<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0911" />
    <meta name="description" content="THREE WORDS — a private two-player conversation game." />
    <title>THREE WORDS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="site-header">
      <button class="brand" data-action="home" aria-label="Three Words home">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>THREE WORDS</span>
      </button>
      <div class="header-actions">
        <span id="connectionPill" class="connection-pill"><i></i> Connecting</span>
        <button class="icon-button" data-action="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)">↗</button>
      </div>
    </header>
    <main id="app" class="app" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
