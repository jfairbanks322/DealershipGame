<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00a88f">
  <title>Play · Story Showdown</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-role="student">
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <div id="connection-banner" class="connection-banner" hidden>Reconnecting to the showdown…</div>
  <header class="site-header">
    <a class="mini-brand" href="/" aria-label="Story Showdown home"><span>SS</span> Story Showdown</a>
    <div class="header-actions">
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
      <button class="icon-button" id="fullscreen-toggle" type="button" aria-label="Toggle fullscreen">⛶</button>
    </div>
  </header>
  <main id="app" class="app-root student-root" aria-live="polite">
    <section class="loading-card"><div class="spinner"></div><p>Getting your writing desk ready…</p></section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/avatars.js"></script>
  <script src="/coop.js"></script>
  <script src="/common.js"></script>
  <script src="/student.js"></script>
</body>
</html>
